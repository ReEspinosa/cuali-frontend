server {
    listen 80;
    root /usr/share/nginx/html;

    # El repo viejo tenia "proxy_pass http://backend:8000/api/;" porque su
    # backend si montaba rutas bajo /api. El backend nuevo NO tiene ese
    # prefijo (sus routers son /auth, /planeaciones, etc. en la raiz), asi
    # que aqui quitamos el "/api/" del destino: nginx reescribe
    # /cuali.ai/api/planeaciones -> /planeaciones en el backend.
    location /cuali.ai/api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /cuali.ai/index.html;
    }
}
